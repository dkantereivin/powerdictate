# Clinical Formatting, Number Conversions & Spoken Punctuation

number_words:
  zero: "0"
  one: "1"
  two: "2"
  three: "3"
  four: "4"
  five: "5"
  six: "6"
  seven: "7"
  eight: "8"
  nine: "9"
  ten: "10"
  eleven: "11"
  twelve: "12"
  fifteen: "15"
  twenty: "20"
  twenty five: "25"
  thirty: "30"
  forty: "40"
  fifty: "50"
  sixty: "60"
  seventy: "70"
  eighty: "80"
  ninety: "90"
  one hundred: "100"
  two hundred: "200"
  two fifty: "250"
  five hundred: "500"

spoken_punctuation:
  "period": "."
  "full stop": "."
  "comma": ","
  "colon": ":"
  "semicolon": ";"
  "semi colon": ";"
  "question mark": "?"
  "exclamation mark": "!"
  "exclamation point": "!"
  "new line": "\n"
  "newline": "\n"
  "new paragraph": "\n\n"
  "new para": "\n\n"
  "open paren": "("
  "close paren": ")"
  "open bracket": "["
  "close bracket": "]"
  "bullet": "• "
  "number 1": "1. "
  "num 1": "1. "
  "number 2": "2. "
  "num 2": "2. "
  "number 3": "3. "
  "num 3": "3. "
  "number 4": "4. "
  "num 4": "4. "
