# Voice Navigation, Formatting, & Template Commands Configuration
# =================================================================
# Allows quick modification of spoken triggers, shortcuts, and clinical templates.
# Supports template bracket fields [***] for seamless "next field" jumping.

commands:
  # -----------------------------------------------------------------
  # Navigation & Template Bracket Commands
  # -----------------------------------------------------------------
  "next field":
    name: "Next Field"
    hotkey: "Tab"
    action: "navigate_next_field"
    description: "Jumps to next [***] template bracket or EMR form field"

  "previous field":
    name: "Previous Field"
    hotkey: "Shift+Tab"
    action: "navigate_prev_field"
    description: "Jumps to previous template field"

  "prev field":
    name: "Previous Field"
    hotkey: "Shift+Tab"
    action: "navigate_prev_field"
    description: "Jumps to previous template field"

  "first field":
    name: "First Field"
    hotkey: "Ctrl+Home, Tab"
    action: "navigate_first_field"
    description: "Jumps to the first [***] bracket placeholder in the note"

  "go to first field":
    name: "First Field"
    hotkey: "Ctrl+Home, Tab"
    action: "navigate_first_field"
    description: "Jumps to the first [***] bracket placeholder in the note"

  # -----------------------------------------------------------------
  # Whitespace & Indentation
  # -----------------------------------------------------------------
  "tab":
    name: "Tab Space"
    hotkey: "Tab"
    action: "tab_space"
    description: "Inserts a tab space or indentation"

  "tab space":
    name: "Tab Space"
    hotkey: "Tab"
    action: "tab_space"
    description: "Inserts a tab space or indentation"

  "tabspace":
    name: "Tab Space"
    hotkey: "Tab"
    action: "tab_space"
    description: "Inserts a tab space or indentation"

  "indent":
    name: "Indent"
    hotkey: "Tab"
    action: "tab_space"
    description: "Inserts an indentation"

  # -----------------------------------------------------------------
  # Editing, Undo & Clearing
  # -----------------------------------------------------------------
  "scratch that":
    name: "Scratch That"
    hotkey: "Ctrl+Z"
    action: "undo"
    description: "Undoes or deletes the last spoken phrase"

  "delete that":
    name: "Scratch That"
    hotkey: "Ctrl+Z"
    action: "undo"
    description: "Undoes or deletes the last spoken phrase"

  "undo":
    name: "Undo"
    hotkey: "Ctrl+Z"
    action: "undo"
    description: "Undoes the last action"

  "select all":
    name: "Select All"
    hotkey: "Ctrl+A"
    action: "select_all"
    description: "Selects all text in current field"

  "clear field":
    name: "Clear Field"
    hotkey: "Ctrl+A, Backspace"
    action: "clear_field"
    description: "Clears all text in the active field"

  "clear all":
    name: "Clear All"
    hotkey: "Ctrl+A, Backspace"
    action: "clear_field"
    description: "Clears all text in the active field"

  # -----------------------------------------------------------------
  # Cursor Navigation
  # -----------------------------------------------------------------
  "go to end":
    name: "End of Text"
    hotkey: "End"
    action: "cursor_end"
    description: "Moves cursor to end of text"

  "go to start":
    name: "Start of Text"
    hotkey: "Home"
    action: "cursor_start"
    description: "Moves cursor to beginning of text"

  "go to beginning":
    name: "Start of Text"
    hotkey: "Home"
    action: "cursor_start"
    description: "Moves cursor to beginning of text"

  # -----------------------------------------------------------------
  # Transfer & Finalization
  # -----------------------------------------------------------------
  "transfer note":
    name: "Transfer Note"
    action: "transfer_text"
    description: "Resolves template defaults and copies note to clipboard"

  "transfer text":
    name: "Transfer Note"
    action: "transfer_text"
    description: "Resolves template defaults and copies note to clipboard"

  # -----------------------------------------------------------------
  # Screen Snip & OCR Ingestion
  # -----------------------------------------------------------------
  "snip labs":
    name: "Snip Labs"
    action: "snip_screen"
    description: "Launches crosshair snip to parse labs from screen"

  "snip screen":
    name: "Snip Labs"
    action: "snip_screen"
    description: "Launches crosshair snip to parse labs from screen"

  "parse labs":
    name: "Parse Image"
    action: "parse_clipboard_image"
    description: "Parses screenshot of labs currently on clipboard"

  "parse image":
    name: "Parse Image"
    action: "parse_clipboard_image"
    description: "Parses screenshot currently on clipboard"

  "parse clipboard":
    name: "Parse Image"
    action: "parse_clipboard_image"
    description: "Parses screenshot currently on clipboard"

  "batch snip":
    name: "Batch Snip"
    hotkey: "Ctrl+Shift+B"
    action: "batch_snip"
    description: "Toggles multi-page batch snip mode"

  "batch labs":
    name: "Batch Snip"
    hotkey: "Ctrl+Shift+B"
    action: "batch_snip"
    description: "Toggles multi-page batch snip mode"

  "finish batch":
    name: "Finish Batch"
    hotkey: "Ctrl+Shift+B"
    action: "batch_snip"
    description: "Finalizes multi-page batch and inserts merged labs"

  "crawl labs":
    name: "Auto-Crawl Meditech"
    action: "auto_crawl_meditech"
    description: "Autonomously crawls Meditech tabs and inserts merged labs"

  "crawl meditech":
    name: "Auto-Crawl Meditech"
    action: "auto_crawl_meditech"
    description: "Autonomously crawls Meditech tabs and inserts merged labs"

  # -----------------------------------------------------------------
  # LLM Template & Text Transformation Commands
  # -----------------------------------------------------------------
  "filter labs":
    name: "Filter Pertinent Labs"
    hotkey: "Ctrl+Alt+T"
    action: "llm_filter_labs"
    description: "Uses AI / clinical rules to select only pertinent or abnormal labs"

  "filter pertinent labs":
    name: "Filter Pertinent Labs"
    hotkey: "Ctrl+Alt+T"
    action: "llm_filter_labs"
    description: "Uses AI / clinical rules to select only pertinent or abnormal labs"

  "llm template":
    name: "LLM Template"
    hotkey: "Ctrl+Alt+T"
    action: "llm_transform"
    description: "Opens LLM transformation menu to transform selected text"

  "transform text":
    name: "LLM Template"
    hotkey: "Ctrl+Alt+T"
    action: "llm_transform"
    description: "Opens LLM transformation menu to transform selected text"

  "transform selection":
    name: "LLM Template"
    hotkey: "Ctrl+Alt+T"
    action: "llm_transform"
    description: "Opens LLM transformation menu to transform selected text"

  "summarize labs":
    name: "Summarize Labs"
    action: "llm_summarize_labs"
    description: "Transforms labs into a concise oral summary for rounds or dictation"

  "format soap":
    name: "Format as SOAP Note"
    action: "llm_soap_format"
    description: "Transforms text and labs into a structured SOAP assessment"


# -------------------------------------------------------------------
# Clinical & Document Templates (Macros)
# Use [***] for bracket placeholder fields navigable via "next field"
# -------------------------------------------------------------------
templates:
  "consult note template":
    name: "Consult Note"
    description: "Consultation - for Internal Medicine"
    text: |
      Date: [***]
      ID: [***] from [home/nursing home/***] with a background of [***], presenting with [***].

      PAST MEDICAL HISTORY:
      [***]

      MEDICATIONS:
      [***]

      SOCIAL HISTORY:
      [***]

      ALLERGIES: [None]

      HISTORY OF PRESENTING ILLNESS:
      [***]

      PHYSICAL EXAMINATION:
      [***]

      INVESTIGATIONS:
      [***]

      ASSESSMENT AND PLAN:
      [***]

      [***]. Housekeeping: 
      - Admit to [MCTU/Hospitalist]
      - Diet and Activity: [As Tolerated/NPO]
      - DVT prophylaxis: [enoxaparin 40mg subcut daily/on DOAC/none]
      - Code Status: Level [5/4/3/2/1/Not Discussed]

  "discharge summary template":
    name: "Discharge Summary"
    description: "Full Discharge Dictation Template"
    text: |
      DISCHARGE SUMMARY
      Date of Admission: [***]
      Date of Discharge: [***]

      MOST RESPONSIBLE DIAGNOSIS:
      [***]

      OTHER DIAGNOSES:
      [***]

      OPERATIONS/PROCEDURES: [None]
      COMPLICATIONS/ADVERSE EVENTS: [None]

      COURSE IN HOSPITAL:
      [***]

      MEDICATIONS:
      [***]

      RECOMMENDATIONS AND ISSUES FOR FOLLOW UP:
      [***]


  "no pe":
    name: "Normal Physical Exam"
    description: "Standard normal complete physical examination"
    text: |
      Constitutional: Alert and oriented x3, no acute distress.
      HEENT: Normocephalic, atraumatic. Pupils equal, round, reactive to light.
      Cardiovascular: Regular rate and rhythm, normal S1 and S2, no murmurs, gallops, or rubs.
      Pulmonary: Clear to auscultation bilaterally, no wheezes, rales, or rhonchi.
      Abdomen: Soft, non-tender, non-distended, normal active bowel sounds.
      Extremities: Warm and well-perfused, no cyanosis, clubbing, or edema.
      Neurological: Alert, oriented, non-focal neurological examination.

  "negative pe":
    name: "Normal Physical Exam"
    description: "Concise normal physical exam"
    text: "Physical Exam: Alert, oriented x3, no acute distress. Heart regular rate and rhythm, normal S1/S2. Lungs clear bilaterally. Abdomen soft, non-tender. Extremities without edema."

  "normal cardiac":
    name: "Normal Cardiac Exam"
    description: "Cardiovascular exam template"
    text: "Cardiovascular: Regular rate and rhythm. S1 and S2 present. No murmurs, gallops, or friction rubs. Peripheral pulses 2+ intact bilaterally."

  "normal lungs":
    name: "Normal Pulmonary Exam"
    description: "Pulmonary examination template"
    text: "Pulmonary: Clear to auscultation bilaterally. No wheezes, crackles, or rhonchi. Respirations unlabored on room air."

  "hf plan":
    name: "Heart Failure Plan"
    description: "Inpatient heart failure management plan"
    text: |
      Heart Failure Management Plan:
      1. Continue furosemide [***] mg IV daily.
      2. Strict intake and output monitoring, daily standing weights.
      3. Fluid restriction 1.5 - 2.0 L/day, 2g sodium cardiac diet.
      4. Morning BMP for renal function and potassium monitoring.
      5. Continue guideline-directed medical therapy as hemodynamically tolerated.

  "soap note":
    name: "SOAP Note"
    description: "Standard clinical SOAP note with bracket fields"
    text: |
      SUBJECTIVE:
      [***]

      OBJECTIVE:
      Vitals: [***]
      Physical Exam: [***]
      Labs & Diagnostics: [***]

      ASSESSMENT:
      [***]

      PLAN:
      1. [***]
      2. [***]

  "discharge summary":
    name: "Discharge Summary"
    description: "Hospital discharge summary template"
    text: |
      DISCHARGE SUMMARY:
      Admission Date: [***]
      Discharge Date: [***]
      Discharge Diagnosis: [***]
      Hospital Course: [***]
      Discharge Medications: [***]
      Follow-up: [***]

  "vte prophylaxis":
    name: "VTE Prophylaxis"
    description: "VTE risk assessment with interactive picklists"
    text: "VTE Prophylaxis: [Indicated/Contraindicated]. Plan: [Enoxaparin 40mg SubQ daily/Heparin 5000 units SubQ TID/SCDs only]. History of HIT: [No/Yes]."

  "review of systems":
    name: "Review of Systems"
    description: "Standard ROS with defaults"
    text: "Constitutional: [Negative/Fever/Fatigue/Weight loss]. Eyes: [Negative/Vision changes]. ENT: [Negative/Sore throat/Congestion]. Cardiovascular: [Negative/Chest pain/Palpitations]. Respiratory: [Negative/Shortness of breath/Cough]. GI: [Negative/Nausea/Vomiting/Abdominal pain]. GU: [Negative/Dysuria]. Musculoskeletal: [Negative/Myalgias/Joint pain]. Neurological: [Negative/Headache/Dizziness]."
