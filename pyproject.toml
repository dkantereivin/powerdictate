[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "powerdictate"
version = "0.1.0"
description = "CTU Clinical Documentation, Automated Dictation & EMR Ingestion Pipeline"
readme = "ctu_dictation_pipeline_spec.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "kokoro",
    "soundfile",
    "sounddevice",
    "scipy",
    "faster-whisper",
    "fastapi",
    "uvicorn",
    "websockets",
    "pytesseract",
    "pillow"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
